# Activate with: --spring.profiles.active=prod (see README "Running with the prod profile")
# This is illustrative, not a fully hardened production config - see README
# "What's NOT real" table for the full list of things that would still need
# to change (HSM-backed keys, real auth on /api/bridge/ingest, etc).

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/upimesh}
spring.datasource.username=${DB_USERNAME:upimesh}
spring.datasource.password=${DB_PASSWORD:upimesh}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false

# Point this at a real Redis in production; the app still falls back to the
# in-JVM IdempotencyService/RateLimiterService until that swap is made in code.
upi.mesh.redis.host=${REDIS_HOST:localhost}
upi.mesh.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info
logging.level.com.demo.upimesh=WARN
