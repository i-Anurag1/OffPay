spring.application.name=upi-offline-mesh
server.port=8080

# --- H2 in-memory database ---
spring.datasource.url=jdbc:h2:mem:upimesh;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Domain config ---
# How long (ms) a MeshPacket / PaymentInstruction is considered fresh before BridgeIngestionService rejects it
upi.mesh.freshness-window-ms=86400000
# How long (ms) an idempotency claim is retained before scheduled eviction
upi.mesh.idempotency-ttl-ms=86400000
# Max bridge-ingest requests allowed per bridge node id within the rate-limit window
upi.mesh.rate-limit.max-requests=20
upi.mesh.rate-limit.window-ms=60000

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.demo.upimesh=INFO
